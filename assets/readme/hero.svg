<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">CareerPathDesk Go 后端</title>
  <desc id="desc">请求依次经过认证、范围复核和事务命令，最终写入 PostgreSQL 与最小审计事实。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#0a393d"/></linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55aaff"/><stop offset="1" stop-color="#55deb6"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="68" y="78" fill="#87c6ff" font-size="21" font-weight="700" letter-spacing="4">SECURE SERVICE BOUNDARY</text>
    <text x="68" y="139" fill="#fff" font-size="48" font-weight="760">CareerPathDesk Backend</text>
    <text x="68" y="178" fill="#bdd2df" font-size="24">权限在服务端复核，业务与审计在同一事务提交</text>
    <path d="M92 278 H1108" stroke="url(#lane)" stroke-width="6" stroke-linecap="round"/>
    <g text-anchor="middle">
      <g transform="translate(120 278)"><circle r="45" fill="#113a5a" stroke="#63b3ff" stroke-width="3"/><text y="9" fill="#fff" font-size="24" font-weight="700">请求</text></g>
      <g transform="translate(360 278)"><rect x="-86" y="-45" width="172" height="90" rx="18" fill="#102f48" stroke="#6fb8ed" stroke-width="2"/><text y="-3" fill="#fff" font-size="24" font-weight="700">认证 / 会话</text><text y="27" fill="#a8c6d9" font-size="18">当前身份</text></g>
      <g transform="translate(610 278)"><rect x="-86" y="-45" width="172" height="90" rx="18" fill="#103a40" stroke="#63d4b7" stroke-width="2"/><text y="-3" fill="#fff" font-size="24" font-weight="700">角色 / 范围</text><text y="27" fill="#abd0c7" font-size="18">对象级复核</text></g>
      <g transform="translate(860 278)"><rect x="-86" y="-45" width="172" height="90" rx="18" fill="#123b3e" stroke="#68d8ae" stroke-width="2"/><text y="-3" fill="#fff" font-size="24" font-weight="700">事务命令</text><text y="27" fill="#add3c6" font-size="18">状态 + 审计</text></g>
      <g transform="translate(1080 278)"><circle r="47" fill="#14433f" stroke="#6ae0b6" stroke-width="3"/><text y="-3" fill="#fff" font-size="22" font-weight="700">Postgres</text><text y="23" fill="#bce0d4" font-size="16">synthetic</text></g>
    </g>
    <text x="68" y="365" fill="#89a8b8" font-size="19">Go · PostgreSQL · 显式合成配置 · Linux 原生入口</text>
  </g>
</svg>
